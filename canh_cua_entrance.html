<style>
        body {
            background-color: #FFF0F7; /* Pastel Pink background */
            margin: 0;
            overflow: hidden; /* Hide scrollbars during animation */
        }

        /* Sakura Animation */
        .sakura-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .petal {
            position: absolute;
            background-color: #FFB7D5;
            border-radius: 150% 0 150% 0;
            opacity: 0.8;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% {
                transform: translateY(-10vh) translateX(0) rotate(0deg);
                opacity: 0;
            }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% {
                transform: translateY(110vh) translateX(20vw) rotate(360deg);
                opacity: 0;
            }
        }

        /* Floating Hearts Animation */
        .floating-heart {
            position: absolute;
            color: #FF8FB8;
            font-size: 24px;
            animation: floatUp 3s ease-in forwards;
            pointer-events: none;
            z-index: 50;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.5); opacity: 1; }
            100% { transform: translateY(-100px) scale(1.5); opacity: 0; }
        }

        /* Shake Animation for Error */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
        .shake-animation {
            animation: shake 0.4s ease-in-out;
        }
        
        /* Final Reveal Animation */
        .portal-flash {
            position: fixed;
            inset: 0;
            background: white;
            opacity: 0;
            pointer-events: none;
            z-index: 100;
            transition: opacity 2s ease-in-out;
        }
        .portal-flash.active {
            opacity: 1;
        }
        
        /* Glassmorphism custom */
        .glass-panel {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 2px solid #FF8FB8;
            box-shadow: 0 10px 40px rgba(255, 143, 184, 0.2);
        }
        
        .pink-shadow-glow {
            box-shadow: 0 0 40px rgba(255, 143, 184, 0.4);
        }

<!-- STITCH_SHADER_START:ANIMATION_21 class="absolute inset-0 w-full h-full z-0 opacity-50" -->
<div class="absolute inset-0 w-full h-full z-0 opacity-50" style="display:block;">
<canvas id="shader-canvas-ANIMATION_21" style="display:block;width:100%;height:100%"></canvas>
<script>
(function() {
  const canvas = document.getElementById('shader-canvas-ANIMATION_21');

  // Sync the WebGL drawing-buffer size with the CSS-driven layout size.
  // This fires on initial layout and whenever the element is resized.
  function syncSize() {
    const w = canvas.clientWidth  || 1280;
    const h = canvas.clientHeight || 720;
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width  = w;
      canvas.height = h;
    }
  }
  if (typeof ResizeObserver !== 'undefined') {
    new ResizeObserver(syncSize).observe(canvas);
  }
  syncSize();

  const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
  if (!gl) return;
  const vs = `attribute vec2 a_position;
varying vec2 v_texCoord;
void main() {
  v_texCoord = a_position * 0.5 + 0.5;
  gl_Position = vec4(a_position, 0.0, 1.0);
}`;
  const fs = `precision highp float;
varying vec2 v_texCoord;
uniform float u_time;
uniform vec2 u_resolution;

void main() {
    vec2 uv = v_texCoord;
    
    // Base pastel pink gradient
    vec3 color1 = vec3(1.0, 0.94, 0.97); // #FFF0F7
    vec3 color2 = vec3(1.0, 0.92, 0.96); // #FFEAF4
    vec3 color3 = vec3(1.0, 0.96, 1.0);  // White-ish pink
    
    float mixVal = sin(uv.x * 1.5 + u_time * 0.3) * 0.5 + 0.5;
    vec3 bgColor = mix(color1, color2, mixVal);
    bgColor = mix(bgColor, color3, cos(uv.y * 2.0 - u_time * 0.2) * 0.5 + 0.5);

    // Subtle moving clouds/mist effect
    float cloud = sin(uv.x * 3.0 + u_time * 0.1) * cos(uv.y * 3.0 + u_time * 0.15);
    bgColor += cloud * 0.02;

    // Soft glowing particles
    float glow = sin(u_time * 1.5 + uv.x * 40.0 + uv.y * 40.0) * 0.5 + 0.5;
    glow = pow(glow, 30.0) * 0.04;
    
    gl_FragColor = vec4(bgColor + glow, 1.0);
}`;
  function cs(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    return s;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, cs(gl.VERTEX_SHADER, vs));
  gl.attachShader(prog, cs(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(prog);
  gl.useProgram(prog);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const pos = gl.getAttribLocation(prog, 'a_position');
  gl.enableVertexAttribArray(pos);
  gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);
  const uTime = gl.getUniformLocation(prog, 'u_time');
  const uRes = gl.getUniformLocation(prog, 'u_resolution');
  const uMouse = gl.getUniformLocation(prog, 'u_mouse');

  // u_mouse is in pixel coordinates matching u_resolution (ShaderToy convention).
  // Shaders that need normalized coords should use: u_mouse / u_resolution.
  let mouse = { x: canvas.width / 2, y: canvas.height / 2 };
  window.addEventListener('mousemove', (event) => {
    const rect = canvas.getBoundingClientRect();
    if (rect.width && rect.height) {
      const nx = (event.clientX - rect.left) / rect.width;
      const ny = 1.0 - (event.clientY - rect.top) / rect.height;
      mouse.x = nx * canvas.width;
      mouse.y = ny * canvas.height;
    }
  });

  function render(t) {
    if (typeof ResizeObserver === 'undefined') syncSize();
    gl.viewport(0, 0, canvas.width, canvas.height);
    if (uTime) gl.uniform1f(uTime, t * 0.001);
    if (uRes) gl.uniform2f(uRes, canvas.width, canvas.height);
    if (uMouse) gl.uniform2f(uMouse, mouse.x, mouse.y);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    requestAnimationFrame(render);
  }
  render(0);
})();
</script>

<script>
        // Sakura Generation
        function createSakura() {
            const container = document.getElementById('sakuraContainer');
            const petalCount = 30; // Adjust for density
            
            for (let i = 0; i < petalCount; i++) {
                const petal = document.createElement('div');
                petal.classList.add('petal');
                
                // Randomize properties
                const size = Math.random() * 15 + 5 + 'px';
                petal.style.width = size;
                petal.style.height = size;
                petal.style.left = Math.random() * 100 + 'vw';
                
                const duration = Math.random() * 5 + 5 + 's';
                const delay = Math.random() * 5 + 's';
                petal.style.animationDuration = duration;
                petal.style.animationDelay = delay;
                
                container.appendChild(petal);
            }
        }
        
        createSakura();

        // Interaction Logic
        const input = document.getElementById('magicInput');
        const btn = document.getElementById('openPortalBtn');
        const errorMsg = document.getElementById('errorMessage');
        const flash = document.getElementById('whiteFlash');
        const mainContent = document.getElementById('portalMain');

        // Input Glow Effect
        input.addEventListener('focus', () => {
            input.classList.add('shadow-[0_0_25px_rgba(255,143,184,0.6)]');
        });
        input.addEventListener('blur', () => {
            input.classList.remove('shadow-[0_0_25px_rgba(255,143,184,0.6)]');
            errorMsg.style.opacity = '0';
            input.classList.remove('shake-animation');
        });

        // Hover Floating Hearts on Button
        btn.addEventListener('mouseenter', (e) => {
            const createFloatingHeart = () => {
                const heart = document.createElement('span');
                heart.classList.add('material-symbols-outlined', 'floating-heart');
                heart.style.fontVariationSettings = "'FILL' 1";
                heart.textContent = 'favorite';
                
                // Random position relative to button
                const rect = btn.getBoundingClientRect();
                const x = Math.random() * rect.width;
                const y = Math.random() * rect.height;
                
                heart.style.left = `${x}px`;
                heart.style.top = `${y}px`;
                
                btn.appendChild(heart);
                
                setTimeout(() => {
                    heart.remove();
                }, 3000);
            };
            
            // Create a few hearts
            for(let i=0; i<3; i++) {
                setTimeout(createFloatingHeart, i * 200);
            }
        });

        // Portal Open Logic
        btn.addEventListener('click', () => {
            if (input.value.trim() === '') {
                // Empty - Shake and Error
                input.classList.remove('shake-animation');
                void input.offsetWidth; // trigger reflow
                input.classList.add('shake-animation');
                errorMsg.style.opacity = '1';
                
                // Vibrate if supported
                if (navigator.vibrate) navigator.vibrate(200);
            } else {
                // Success - Portal Animation
                errorMsg.style.opacity = '0';
                
                // Speed up sakura
                const petals = document.querySelectorAll('.petal');
                petals.forEach(p => {
                    p.style.animationDuration = (Math.random() * 2 + 1) + 's';
                });
                
                // Fade out main content
                mainContent.style.transition = 'transform 1.5s ease-in, opacity 1s ease-out';
                mainContent.style.transform = 'scale(1.5)';
                mainContent.style.opacity = '0';
                
                // Show bright light flash
                setTimeout(() => {
                    flash.classList.add('active');
                }, 500);
                
                // Reset or navigate after animation (demo purpose)
                setTimeout(() => {
                    input.value = '';
                    mainContent.style.transform = 'scale(1)';
                    mainContent.style.opacity = '1';
                    flash.classList.remove('active');
                    
                    // Reset sakura speed
                    petals.forEach(p => {
                        p.style.animationDuration = (Math.random() * 5 + 5) + 's';
                    });
                }, 3500);
            }
        });
        
        // Listen for Enter key
        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                btn.click();
            }
        });
    </script>
