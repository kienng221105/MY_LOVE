version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ourspace_postgres
    restart: always
    environment:
      POSTGRES_USER: ourspace
      POSTGRES_PASSWORD: ourspace_pass
      POSTGRES_DB: ourspace_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ourspace_nestjs_backend
    restart: always
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: "postgresql://ourspace:ourspace_pass@postgres:5432/ourspace_db?schema=public"
      JWT_SECRET: "ourspace_jwt_secret_key_super_secure_2026"
    depends_on:
      - postgres

volumes:
  postgres_data:
